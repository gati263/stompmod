<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" role="img" aria-label="GaTi's Stomp">
  <title>GaTi's Stomp — boot screen</title>
  <rect width="320" height="240" fill="#1E1D1C"/>

  <defs><filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter></defs><g filter="url(#glow)" fill="none"><circle cx="160" cy="140" r="9" stroke="#8DAA6C" stroke-width="8" opacity="1"/><circle cx="160" cy="140" r="15" stroke="#8DAA6C" stroke-width="4" opacity="0.5"/></g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- top jacks -->
    <g stroke="#A8A5A0" stroke-width="2">
      <rect x="110" y="45" width="12" height="7" rx="2"/>
      <rect x="135" y="45" width="12" height="7" rx="2"/>
      <rect x="160" y="45" width="12" height="7" rx="2"/>
      <rect x="185" y="45" width="12" height="7" rx="2"/>
      <rect x="210" y="45" width="12" height="7" rx="2"/>
    </g>

    <!-- body + footswitch shelf -->
    <rect x="85" y="52" width="150" height="106" rx="10" stroke="#EBE9E4" stroke-width="3"/>
    <line x1="85" y1="122" x2="235" y2="122" stroke="#EBE9E4" stroke-width="3"/>

    <!-- screen -->
    <rect x="97" y="62" width="54" height="34" rx="4" stroke="#80A89D" stroke-width="2.5"/>
    <line x1="106" y1="74" x2="130" y2="74" stroke="#80A89D" stroke-width="2"/>
    <g stroke="#A8A5A0" stroke-width="2">
      <line x1="106" y1="86" x2="112" y2="86"/>
      <line x1="121" y1="86" x2="127" y2="86"/>
      <line x1="136" y1="86" x2="142" y2="86"/>
    </g>

    <!-- parameter knobs -->
    <g stroke="#EBE9E4" stroke-width="2">
      <circle cx="106" cy="108" r="5"/>
      <circle cx="124" cy="108" r="5"/>
      <circle cx="142" cy="108" r="5"/>
    </g>

    <!-- nav buttons with encoders -->
    <g stroke="#EBE9E4" stroke-width="2">
      <rect x="162" y="62" width="44" height="16" rx="4"/>
      <circle cx="184" cy="70" r="6"/>
      <rect x="162" y="88" width="44" height="16" rx="4"/>
      <circle cx="184" cy="96" r="6"/>
    </g>

    <!-- volume -->
    <circle cx="221" cy="80" r="7" stroke="#EBE9E4" stroke-width="2"/>
    <line x1="221" y1="80" x2="226" y2="76" stroke="#D29E55" stroke-width="2"/>

    <!-- footswitches: Plum / Moss / Terracotta rings -->
    <circle cx="112" cy="140" r="9" stroke="#544853" stroke-width="3"/>
    <circle cx="160" cy="140" r="9" stroke="#8DAA6C" stroke-width="3"/>
    <circle cx="208" cy="140" r="9" stroke="#52423E" stroke-width="3"/>
    <g stroke="#EBE9E4" stroke-width="2">
      <circle cx="112" cy="140" r="3.5"/>
      <circle cx="160" cy="140" r="3.5"/>
      <circle cx="208" cy="140" r="3.5"/>
    </g>
  </g>

  <text x="160" y="198" text-anchor="middle" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-weight="600" font-size="24" letter-spacing="0.3" fill="#EBE9E4">GaTi's HX Stomp</text>
</svg>
