<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240" role="img" aria-label="GaTi's HX Stomp">
  <title>GaTi's HX Stomp, signal chain boot screen</title>
  <!-- The stock loading bar (app y 121: rows 117-118, red, filling left to right) is drawn over this picture as the signal
       path through the five blocks. The boot line is hidden (HX_SPLASH_LINE=hide). -->
  <rect width="320" height="240" fill="#1E1D1C"/>
  <text x="160" y="70" text-anchor="middle" font-family="Newsreader, Georgia, 'Times New Roman', serif" font-weight="600" font-size="30" fill="#EBE9E4">GaTi's HX Stomp</text>
  <rect x="52" y="106" width="32" height="28" rx="5" fill="#1E1D1C" stroke="#D1ACD3" stroke-width="2.5"/><rect x="98" y="106" width="32" height="28" rx="5" fill="#1E1D1C" stroke="#8DAA6C" stroke-width="2.5"/><rect x="144" y="106" width="32" height="28" rx="5" fill="#1E1D1C" stroke="#D29E55" stroke-width="2.5"/><rect x="190" y="106" width="32" height="28" rx="5" fill="#1E1D1C" stroke="#80A89D" stroke-width="2.5"/><rect x="236" y="106" width="32" height="28" rx="5" fill="#1E1D1C" stroke="#CD998E" stroke-width="2.5"/>
  <text x="160" y="160" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="3" fill="#A8A5A0">SIGNAL CHAIN LOADING</text>
</svg>
